<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mi experiencia AR - Nuevo target</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    body { margin: 0; overflow: hidden; }
    #aviso {
      position: fixed; top: 12px; left: 12px; right: 12px;
      z-index: 10; padding: 10px; border-radius: 8px;
      background: #153451; color: white;
      font: 16px Arial; text-align: center;
      pointer-events: none; transition: background .3s;
    }
  </style>
</head>
<body>
  <div id="aviso">Autoriza la cámara y apunta al marcador</div>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; filterMinCF: 0.0001; filterBeta: 0.001;"
    color-space="sRGB"
    renderer="colorManagement: true;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <a-asset-item id="modelo" src="./modelo.glb"></a-asset-item>
    </a-assets>

    <a-entity light="type: ambient; intensity: 0.8"></a-entity>
    <a-entity light="type: directional; intensity: 0.8" position="0 1 1"></a-entity>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity id="target" mindar-image-target="targetIndex: 0">
      <!-- Base semitransparente sobre el marcador -->
      <a-plane color="#168BCD" opacity="0.35" width="1" height="1" position="0 0 0"></a-plane>

      <!-- Modelo 3D girando (reemplaza modelo.glb por el tuyo si quieres) -->
      <a-entity position="0 -0.25 0.05"
                animation="property: rotation; to: 0 0 360; loop: true; dur: 6000; easing: linear">
        <a-gltf-model src="#modelo" rotation="90 0 0" scale="0.3 0.3 0.3"></a-gltf-model>
      </a-entity>

      <!-- Esfera flotando alrededor -->
      <a-sphere color="#F5A623" radius="0.08" position="0.35 0 0.3"
                animation="property: position; to: 0.35 0 0.6; dir: alternate; loop: true; dur: 1200"></a-sphere>

      <!-- Texto -->
      <a-text value="Realidad Aumentada" color="#FFFFFF" align="center"
              width="2" position="0 0.62 0.05"></a-text>
    </a-entity>
  </a-scene>

  <script>
    const aviso = document.getElementById('aviso');
    const target = document.getElementById('target');
    target.addEventListener('targetFound', () => {
      aviso.textContent = '¡Marcador detectado!';
      aviso.style.background = '#1E8449';
    });
    target.addEventListener('targetLost', () => {
      aviso.textContent = 'Apunta al marcador';
      aviso.style.background = '#153451';
    });
  </script>
</body>
</html>
